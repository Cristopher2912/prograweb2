# Host Nginx reverse proxy for the PRODUCTION environment.
# Public entry point -> Docker containers bound to 127.0.0.1 only.

server {
    listen 80;
    server_name _;

    root /var/www/progra-web-prod/home;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8081;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8180/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5273/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8082;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5274/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

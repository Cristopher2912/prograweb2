# Host Nginx reverse proxy for the TESTING environment.
# Public entry point -> Docker containers bound to 127.0.0.1 only.

server {
    listen 8090;
    server_name _;

    root /home/ec2-user/progra-web-test/home;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8091;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5173/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8092;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5174/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

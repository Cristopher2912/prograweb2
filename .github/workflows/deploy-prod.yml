          source: "docker-compose.prod.yml,deploy/nginx/production.conf,home/index.html"
          target: "~/progra-web-prod"
          strip_components: 0

      - name: Deploy containers and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/progra-web-prod
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cat > .env << EOF
            BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-backend:prod
            PM_FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-product-manager-frontend:prod
            RM_FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-rick-and-morty-frontend:prod
            EOF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sed -i \
              -e "s#__PRODUCT_MANAGER_URL__#http://${{ secrets.ALB_DNS }}:8081/#g" \
              -e "s#__RICK_AND_MORTY_URL__#http://${{ secrets.ALB_DNS }}:8082/#g" \
              home/index.html
            sudo mkdir -p /var/www/progra-web-prod/home
            sudo cp home/index.html /var/www/progra-web-prod/home/index.html
            sudo chmod -R 755 /var/www/progra-web-prod
            sudo cp deploy/nginx/production.conf /etc/nginx/conf.d/production.conf
            sudo nginx -t
            sudo systemctl reload nginx

  deploy-instance-3:
    name: Deploy to EC2 instance 3 (production)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_3 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/production.conf,home/index.html"
          target: "~/progra-web-prod"
          strip_components: 0

      - name: Deploy containers and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST_3 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/progra-web-prod
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cat > .env << EOF
            BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-backend:prod
            PM_FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-product-manager-frontend:prod
            RM_FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-rick-and-morty-frontend:prod
            EOF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sed -i \
              -e "s#__PRODUCT_MANAGER_URL__#http://${{ secrets.ALB_DNS }}:8081/#g" \
              -e "s#__RICK_AND_MORTY_URL__#http://${{ secrets.ALB_DNS }}:8082/#g" \
              home/index.html
            sudo mkdir -p /var/www/progra-web-prod/home
            sudo cp home/index.html /var/www/progra-web-prod/home/index.html
            sudo chmod -R 755 /var/www/progra-web-prod
            sudo cp deploy/nginx/production.conf /etc/nginx/conf.d/production.conf
            sudo nginx -t
            sudo systemctl reload nginx

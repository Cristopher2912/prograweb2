name: Deploy to testing

# Runs on every push to the test branch. Builds the three Docker images,
# pushes them to GitHub Container Registry, then deploys to the EC2
# testing environment over SSH.

on:
  push:
    branches: [test]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/progra-web

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/product-manager/backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:test

      - name: Build and push Product Manager frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/product-manager/frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-product-manager-frontend:test

      - name: Build and push Rick and Morty frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/rick-and-morty/frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-rick-and-morty-frontend:test

  deploy:
    name: Deploy to EC2 (testing)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,deploy/nginx/test.conf,home/index.html"
          target: "~/progra-web-test"
          strip_components: 0

      - name: Deploy containers and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/progra-web-test
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            cat > .env << EOF
            BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-backend:test
            PM_FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-product-manager-frontend:test
            RM_FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-rick-and-morty-frontend:test
            EOF
            docker compose pull
            docker compose up -d
            sed -i \
              -e "s#__PRODUCT_MANAGER_URL__#http://${{ secrets.EC2_HOST }}:8091/#g" \
              -e "s#__RICK_AND_MORTY_URL__#http://${{ secrets.EC2_HOST }}:8092/#g" \
              home/index.html
            sudo mkdir -p /var/www/progra-web-test/home
            sudo cp home/index.html /var/www/progra-web-test/home/index.html
            sudo chmod -R 755 /var/www/progra-web-test
            sudo cp deploy/nginx/test.conf /etc/nginx/conf.d/test.conf
            sudo nginx -t
            sudo systemctl reload nginx
